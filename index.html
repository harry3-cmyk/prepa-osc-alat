<html lang="fr">
<head>

<meta name="theme-color" content="#F6F8FA" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prépa ALAT">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Prépa OSC Pilote ALAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Mise en page : appli téléphone — bandeau, vue défilante, dock de 4 onglets. Nuit cockpit : fond bleu nuit, accent ambre des instruments. */
:root {
  --bg: #0A1016; --bg-2: #0D151D; --surface: #111B25; --surface-2: #172431; --line: #22344A;
  --fg: #E4ECF2; --muted: #8C9DAE; --accent: #F2B13B; --accent-ink: #1B1304; --sky: #5BB6F0;
  --ok: #45CF8C; --ko: #FF6B5E; --mid: #E9C46A;
  --heli: #6E7B4E; --heli-dark: #2F3527; --glass: #6FA9CF;
  --display: 'Saira Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  --r: 14px; --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #E8EDF1; --bg-2: #F6F8FA; --surface: #FFFFFF; --surface-2: #EEF3F6; --line: #D2DCE4;
  --fg: #0E1A24; --muted: #566878; --accent: #A96A00; --accent-ink: #FFFFFF; --sky: #1E78BE;
  --ok: #12814F; --ko: #C9372A; --mid: #8F6400; --heli: #6E7B4E; --heli-dark: #3A4230; --glass: #5E98C2;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #E8EDF1; --bg-2: #F6F8FA; --surface: #FFFFFF; --surface-2: #EEF3F6; --line: #D2DCE4;
  --fg: #0E1A24; --muted: #566878; --accent: #A96A00; --accent-ink: #FFFFFF; --sky: #1E78BE;
  --ok: #12814F; --ko: #C9372A; --mid: #8F6400; --heli: #6E7B4E; --heli-dark: #3A4230; --glass: #5E98C2;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--sky); }
h2, h3, h4 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.12; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.ok { color: var(--ok); } .ko { color: var(--ko); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.eyebrow { display: block; font: 600 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.eyebrow.ok { color: var(--ok); } .eyebrow.ko { color: var(--ko); }

/* ----- Coque ----- */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.top { display: flex; align-items: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) var(--gut-r) 12px var(--gut-l); background: var(--bg-2); border-bottom: 1px solid var(--line); }
.top .tt { flex: 1; min-width: 0; }
.top h1 { font: 700 26px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .eyebrow { color: var(--accent); }
#back { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); }
#back svg { width: 20px; height: 20px; transform: scaleX(-1); }
svg path, svg line { vector-effect: non-scaling-stroke; }
#back svg path, .icon-btn svg path, .chev svg path, .circuit svg path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.top .badge { font: 600 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 3px 8px; }
#view { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 16px var(--gut-r) 28px var(--gut-l); overscroll-behavior: contain; }
.vin { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.dock { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg-2); border-top: 1px solid var(--line); padding: 6px var(--gut-r) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gut-l); }
.dock button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; border-radius: 12px; color: var(--muted); font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.dock svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dock button[aria-current="page"] { color: var(--accent); }
.dock button[aria-current="page"] svg { stroke-width: 2.2; }

/* ----- Blocs ----- */
.hero { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 16px; border-radius: var(--r); background: linear-gradient(135deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); }
.hero-l { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hero h2 { font-size: 24px; text-transform: uppercase; }
.hero p { color: var(--muted); font-size: 14px; }
.hero-r { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; width: 104px; text-align: center; color: var(--muted); }
.hero-r .sm { font-size: 11px; line-height: 1.3; }
.countdown { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--accent-ink); background: var(--accent); border-radius: 6px; padding: 3px 8px; }
.circuit { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r); background: var(--accent); color: var(--accent-ink); }
.circuit > span:first-child { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.14); display: grid; place-items: center; flex: none; }
.circuit svg { width: 18px; height: 18px; } .circuit svg path { fill: currentColor; stroke: none; }
.circuit b { display: block; font: 700 18px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.circuit small { font-size: 13px; opacity: .85; }
h3.sec { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
h3.sec span { font: 500 13px var(--body); text-transform: none; letter-spacing: 0; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; }
.trow { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); width: 100%; min-height: 64px; }
.trow:active { transform: scale(.99); }
.trow.big { min-height: 76px; }
.trow.static:active { transform: none; }
.tile { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--surface-2); color: var(--sky); border: 1px solid var(--line); }
.tile.alt { color: var(--fg); } .tile.hot { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
.tile.sm { width: 34px; height: 34px; font-size: 12px; border-radius: 8px; }
.tr-m { display: flex; flex-direction: column; min-width: 0; }
.tr-m b { font-weight: 600; font-size: 16px; }
.tr-m span { color: var(--muted); font-size: 13px; }
.tr-r { display: flex; align-items: center; gap: 8px; }
.chev svg { width: 18px; height: 18px; color: var(--muted); }
.chip { font: 700 12px/1 var(--mono); padding: 5px 8px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.chip.mid { color: var(--mid); border-color: color-mix(in srgb, var(--mid) 45%, transparent); background: color-mix(in srgb, var(--mid) 12%, transparent); }
.chip.ko { color: var(--ko); border-color: color-mix(in srgb, var(--ko) 45%, transparent); background: color-mix(in srgb, var(--ko) 12%, transparent); }
.chip.none { color: var(--muted); border-color: var(--line); }
.spark { width: 52px; height: 20px; display: block; flex: none; }
.statsbox .spark { width: 100%; height: 60px; }
.sp-a { fill: color-mix(in srgb, var(--sky) 16%, transparent); stroke: none; }
.sp-l { fill: none; stroke: var(--sky); stroke-width: 1.8; stroke-linejoin: round; }
.sp-d { fill: var(--sky); }
.ring .rg-b { fill: none; stroke: var(--surface-2); stroke-width: 10; }
.ring .rg-f { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ring.ok .rg-f { stroke: var(--ok); } .ring.mid .rg-f { stroke: var(--mid); } .ring.ko .rg-f, .ring.none .rg-f { stroke: var(--ko); }
.ring .rg-t { fill: var(--fg); font: 700 34px var(--mono); text-anchor: middle; dominant-baseline: middle; }
.ring .rg-u { fill: var(--muted); font: 500 11px var(--body); text-anchor: middle; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; text-align: center; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--ko); color: #fff; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { color: var(--sky); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.linkbtn.sm { font-size: 13px; }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; } .row2 > .btn { flex: 1 1 140px; }
.detail { display: flex; flex-direction: column; gap: 14px; }
.lead { font-size: 17px; }
.facts { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 4px; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.statsbox { display: flex; flex-direction: column; gap: 10px; }
.sb-k, .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.sb-k > div, .kpis > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.sb-k b, .kpis b { font-size: 20px; } .sb-k span, .kpis span { font-size: 12px; color: var(--muted); }
.kpis.big b { font-size: 28px; }
.tips, .checks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.tips li { position: relative; padding-left: 18px; }
.tips li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); transform: rotate(45deg); }
.checks li { padding: 8px 10px 8px 34px; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.checks li::before { content: ""; position: absolute; left: 10px; top: 11px; width: 14px; height: 14px; border: 2px solid var(--muted); border-radius: 4px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.seg button { flex: 1; padding: 8px 10px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.seg.wrap { flex-wrap: wrap; } .seg.wrap button { flex: 1 1 auto; }
.seg.full { position: sticky; top: -16px; z-index: 2; }
.seg.full button { padding: 8px 2px; font-size: 13px; }
.week ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.week li { display: grid; grid-template-columns: 78px 1fr; gap: 8px; font-size: 14px; }
.week li b { font-weight: 600; color: var(--accent); }
.techs { display: flex; flex-direction: column; gap: 8px; }
.tech { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tech summary { cursor: pointer; list-style: none; display: flex; flex-direction: column; gap: 2px; position: relative; padding-right: 24px; }
.tech summary::-webkit-details-marker { display: none; }
.tech summary::after { content: "+"; position: absolute; right: 0; top: 50%; transform: translateY(-50%); font: 700 18px/1 var(--mono); color: var(--accent); }
.tech[open] summary::after { content: "–"; }
.tech summary b { font: 700 18px var(--display); text-transform: uppercase; letter-spacing: .02em; }
.tech .tips { margin-top: 10px; font-size: 15px; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.settings { display: flex; flex-direction: column; gap: 8px; }
input[type=number], input[type=date], select, textarea { width: 100%; font: 500 16px var(--body); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { resize: vertical; line-height: 1.5; }
.form label { font-weight: 600; font-size: 14px; }

/* ----- Simu (accueil) ----- */
.sim-hero { display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: var(--r); background: #05080B; color: #E4ECF2; border: 1px solid #1C2A38; }
.sim-hero h2 { font-size: 21px; } .sim-hero p { color: #9FB0C0; font-size: 14px; margin-top: 6px; }
.sim-hero .eyebrow { color: #F2B13B; }
.sim-pv { width: 92px; height: 92px; flex: none; position: relative; border: 1.5px solid #2A3B4D; border-radius: 6px; }
.sim-pv .ind { position: absolute; display: block; }
.sim-pv .ind.b { width: 14px; height: 14px; border-radius: 50%; background: #4DA8FF; left: 52px; top: 30px; animation: drift 4s ease-in-out infinite; }
.sim-pv .ind.g { width: 6px; height: 60px; left: -14px; top: 16px; background: linear-gradient(#2A3B4D, #2A3B4D) center/6px 100% no-repeat; }
.sim-pv .ind.g::after { content: ""; position: absolute; left: -6px; top: 18px; width: 18px; height: 7px; background: #3DDC84; animation: dv 3s ease-in-out infinite; }
.sim-pv .ind.r { height: 6px; width: 60px; left: 16px; bottom: -16px; background: #2A3B4D; }
.sim-pv .ind.r::after { content: ""; position: absolute; top: -6px; left: 36px; width: 7px; height: 18px; background: #FF4D4D; animation: dh 3.6s ease-in-out infinite; }
@keyframes drift { 50% { transform: translate(-22px, 18px); } }
@keyframes dv { 50% { transform: translateY(22px); } }
@keyframes dh { 50% { transform: translateX(-26px); } }

/* ----- Sport, lettre, entretiens, fiches ----- */
.sportgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.note { font-size: 26px; font-weight: 700; color: var(--accent); }
.chrono { font-size: 32px; font-weight: 700; } .chrono.low { color: var(--ko); }
.card.total { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
b.big { font-size: 30px; display: block; }
.lettre-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.simq .q { font: 700 20px/1.25 var(--display); }
.tipbox { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.qa, .fiches { display: flex; flex-direction: column; gap: 8px; }
.qa-i, .fiche { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.qa-i summary, .fiche summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.qa-i summary::after, .fiche summary::after { content: "+"; font: 700 18px/1 var(--mono); color: var(--accent); }
.qa-i[open] summary::after, .fiche[open] summary::after { content: "–"; }
.qa-i summary::-webkit-details-marker, .fiche summary::-webkit-details-marker { display: none; }
.qa-i p, .fiche p { margin: 10px 0; color: var(--fg); }
.fiche summary { font: 700 19px var(--display); text-transform: uppercase; letter-spacing: .02em; }

/* ----- Bilan ----- */
.kpis.strip { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.kpis.strip > div { padding: 10px 8px; }
.kpis.strip b { font-size: 20px; } .kpis.strip span { font-size: 11px; line-height: 1.25; }
.plan ol { margin: 0; padding: 0; list-style: none; counter-reset: p; display: flex; flex-direction: column; gap: 6px; }
.plan li { counter-increment: p; display: flex; flex-direction: column; padding-left: 30px; position: relative; }
.plan li::before { content: counter(p); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); font: 700 12px/22px var(--mono); text-align: center; color: var(--accent); }
.plan li span { color: var(--muted); font-size: 13px; }
.stages { display: flex; flex-direction: column; gap: 10px; }
.stage { display: flex; flex-direction: column; gap: 6px; }
.st-h { display: flex; justify-content: space-between; gap: 10px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--ko); }
.bar i.ok { background: var(--ok); } .bar i.mid { background: var(--mid); }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.rank { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.rank li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.table { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.tb-r { display: grid; grid-template-columns: 34px 1fr 70px auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.tb-r:first-child { border-top: 0; }
.tb-n { display: flex; flex-direction: column; min-width: 0; font-weight: 600; }
.tb-n small { font-weight: 400; color: var(--muted); font-size: 12px; }
.tb-r .spark { width: 70px; height: 22px; }
.table > p { padding: 14px; }
.hist { display: flex; flex-direction: column; gap: 4px; }
.hs-r { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 8px 2px; border-bottom: 1px dashed var(--line); }
.hs-r span:nth-child(2) { display: flex; flex-direction: column; } .hs-r small { color: var(--muted); font-size: 12px; }
.foot-links { display: flex; justify-content: center; padding-top: 8px; }
.empty { padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.veille-h { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.veille-h > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.news ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.feed { display: flex; flex-direction: column; gap: 10px; }
.fd { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.fd-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tag { font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.fd h4 { font-size: 19px; }
.src { font-size: 13px; color: var(--muted); }
.cond ul { margin: 0; padding-left: 18px; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 22px; position: relative; display: flex; flex-direction: column; gap: 14px; counter-reset: s; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.timeline li { position: relative; counter-increment: s; }
